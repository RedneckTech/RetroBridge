; =============================================================================
; RetroBridge — Open SIMH Configuration for DEC PDP-11/44
; =============================================================================
;
; Emulates a PDP-11/44 with 256 KW (512 KB) RAM, two RL02 disk drives, and
; 4 DZ serial multiplexer ports exposed over TCP for RetroBridge.
;
; Prerequisites:
;   - Open SIMH (https://github.com/open-simh/simh) compiled with
;     networking support.
;   - A bootable disk image (e.g., RSTS/E, RT-11, 2.11 BSD Unix, RSX-11M).
;     Place the disk image alongside this config or set the ATTACH path.
;
; Usage:
;   pdp11 simh-pdp11.ini
;
;   The emulator will listen on the TCP ports below.  Configure the
;   corresponding RetroBridge DevicePort entries using transport=tcp:
;
;     Port   RetroBridge Purpose   SIMH Serial Line
;     ─────  ────────────────────  ────────────────
;     10023  job_queue             DZ line 0 (console / job transfer)
;     10024  interactive           DZ line 1 (terminal login)
;     10025  interactive           DZ line 2 (terminal login)
;     10026  interactive           DZ line 3 (terminal login)
;
; Notes:
;   - The DZ supports 8-bit, no parity; set RetroBridge ports to
;     parity=N, data_bits=8, stop_bits=1, newline_mode=crlf.
;   - Baud rate is virtual (ignored by SIMH).  Any value is fine.
; =============================================================================

; ── CPU and memory ───────────────────────────────────────────────────────────
SET CPU 11/44
SET CPU 256K

; ── Disks ────────────────────────────────────────────────────────────────────
SET RL ENABLE
SET RL0 RL02
SET RL1 RL02
ATTACH RL0 pdp11-rsts.dsk              ; ← adjust path to your disk image
; ATTACH RL1 pdp11-data.dsk            ; optional second disk, uncomment as needed

; ── Serial ports (DZ11 8-line multiplexer) ───────────────────────────────────
SET DZ ENABLE
SET DZ LINES=4                         ; use 4 of the 8 available lines

; DZ line 0 — job queue port (RetroBridge workers connect here for XMODEM)
;   SIMH syntax varies by version.  Uncomment the one that works for you:
ATTACH DZ 10023=TCP:10023
; ATTACH DZ0 10023 CONNECT=TCP:10023     ; alternative syntax (newer SIMH)

; DZ line 1 — interactive terminal (user logins)
ATTACH DZ 10024=TCP:10024

; DZ line 2 — interactive terminal
ATTACH DZ 10025=TCP:10025

; DZ line 3 — interactive terminal
ATTACH DZ 10026=TCP:10026

; ── Boot ─────────────────────────────────────────────────────────────────────
; BOOT RL0                 ; auto-boot — uncomment once disk is configured
; ─────────────────────────────────────────────────────────────────────────────
