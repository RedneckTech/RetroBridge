; =============================================================================
; RetroBridge — CPU7Plus Configuration for Centurion CPU-6
; =============================================================================
;
; Emulates a Centurion CPU-6 running the Centurion Multi-User Operating
; System (BOS/5+).  Exposes serial terminal ports over TCP for RetroBridge.
;
; Prerequisites:
;   - CPU7Plus emulator (legacy tool for Centurion systems)
;   - A bootable disk image of the Centurion OS.
;
; Usage:
;   cpu7plus cpu7plus.ini
;
;   Configure the corresponding RetroBridge DevicePort entries using
;   transport=tcp or transport=telnet (depending on emulator mode):
;
;     Port   RetroBridge Purpose   Centurion Port
;     ─────  ────────────────────  ──────────────
;     10901  job_queue             TTY0 (loader / XMODEM receive)
;     10902  interactive           TTY1 (multi-user login)
;     10903  interactive           TTY2 (multi-user login)
;
; Notes:
;   - CPU7Plus uses 9600 baud, 8N1 by default.  Match these in RetroBridge
;     port settings or configure the transport to match.
;   - If the emulator exposes telnet instead of raw TCP, use
;     transport=telnet in RetroBridge.
;   - The CPU7Plus emulator is available from the Centurion community archives.
; =============================================================================

; ── CPU model ────────────────────────────────────────────────────────────────
CPU 6
SPEED 4000000                          ; 4 MHz (matches historical CPU-6)

; ── Memory ───────────────────────────────────────────────────────────────────
RAM 65536                              ; 64 KB (standard CPU-6 configuration)

; ── Disk ─────────────────────────────────────────────────────────────────────
DISK 0 TYPE=WINCHESTER SIZE=10         ; 10 MB Winchester drive
DISK 0 FILE=centurion-os.dsk           ; ← adjust path to your OS disk image

; ── Serial ports ─────────────────────────────────────────────────────────────
;
; TTY0 — Job queue (loader port)
;   RetroBridge workers connect here, send XMODEM R command, and transfer
;   programs.  The Centurion loader listens on TTY0 after boot.
;
PORT 0 NAME=TTY0 MODE=SERVER TCP=10901 BAUD=9600 DATA=8 PARITY=N STOP=1

;
; TTY1 — Interactive terminal (multi-user login)
;   Users connect via the RetroBridge web terminal interface.
;
PORT 1 NAME=TTY1 MODE=SERVER TCP=10902 BAUD=9600 DATA=8 PARITY=N STOP=1

;
; TTY2 — Interactive terminal
;
PORT 2 NAME=TTY2 MODE=SERVER TCP=10903 BAUD=9600 DATA=8 PARITY=N STOP=1

; ── Boot ─────────────────────────────────────────────────────────────────────
; BOOT                    ; auto-boot — uncomment once OS disk is configured
; ─────────────────────────────────────────────────────────────────────────────
